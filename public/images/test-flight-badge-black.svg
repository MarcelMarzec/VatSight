<svg xmlns="http://www.w3.org/2000/svg" width="119.66407" height="40" viewBox="0 0 119.66407 40">
  <title>Join the beta on TestFlight</title>
  <defs>
    <linearGradient id="tfIcon" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#35c2ff"/>
      <stop offset="1" stop-color="#0a6cff"/>
    </linearGradient>
  </defs>
  <!-- Badge body: matches the App Store badge (grey hairline border, black fill) -->
  <rect x="0" y="0" width="119.66407" height="40" rx="8.44" ry="8.44" fill="#a6a6a6"/>
  <rect x="0.875" y="0.875" width="117.91407" height="38.25" rx="7.6" ry="7.6" fill="#000"/>
  <!-- Icon: blue disc with a white three-blade propeller -->
  <g transform="translate(19.4 20)">
    <circle r="10.6" fill="url(#tfIcon)"/>
    <g fill="#fff">
      <path id="blade" d="M0,-1.3 C1.6,-3 2.4,-6.2 1.2,-8.2 C0.6,-9.1 -0.6,-9.1 -1.2,-8.2 C-2.4,-6.2 -1.6,-3 0,-1.3 Z"/>
      <use href="#blade" transform="rotate(120)"/>
      <use href="#blade" transform="rotate(240)"/>
      <circle r="1.9"/>
    </g>
    <circle r="0.8" fill="#0a6cff"/>
  </g>
  <!-- Text -->
  <g fill="#fff" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', Helvetica, Arial, sans-serif">
    <text x="37.6" y="14.6" font-size="8" font-weight="500" textLength="56" lengthAdjust="spacingAndGlyphs">Join the beta on</text>
    <text x="37" y="30.4" font-size="17" font-weight="500" letter-spacing="-0.3" textLength="72.5" lengthAdjust="spacingAndGlyphs">TestFlight</text>
  </g>
</svg>
